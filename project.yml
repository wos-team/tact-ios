name: TACT
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    TACT_APP_GROUP: group.com.wosteam.tact-ios
    DEVELOPMENT_TEAM: 76XA5B7G8R
targets:
  TACT:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wosteam.tact-ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Configuration/TACT.plist
        INFOPLIST_KEY_CFBundleDisplayName: my tact
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: Configuration/TACT.entitlements
    dependencies:
      - target: TACTWidget
        embed: true
  TACTWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wosteam.tact-ios.widget
        INFOPLIST_FILE: Configuration/Widget.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/TACT.entitlements
        SKIP_INSTALL: YES
schemes:
  TACT:
    build:
      targets:
        TACT: all
